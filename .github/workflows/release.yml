name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CFBundleShortVersionString (for example: 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remember-who-you-are-release
  cancel-in-progress: false

env:
  REPO: rckbrcls/remember-who-you-are
  APPCAST_PATH: appcast.xml
  SPARKLE_TOOLS_VERSION: 2.9.2

jobs:
  build:
    name: Build and sign update
    runs-on: macos-26
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
      zip_length: ${{ steps.package.outputs.zip_length }}
      ed_signature: ${{ steps.sign.outputs.ed_signature }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format."; exit 1
          fi
          if gh release view "v${RELEASE_VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists."; exit 1
          fi

      - name: Test core
        run: swift test

      - name: Build universal app
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
          RWYA_NO_LAUNCH: "1"
        run: zsh build-app.sh

      - name: Package ZIP
        id: package
        run: |
          set -euo pipefail
          ZIP_NAME="RememberWhoYouAre-macos-universal-v${{ inputs.version }}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "build/Remember Who You Are.app" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_length=$(stat -f%z "$ZIP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Sign update with EdDSA
        id: sign
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "Missing SPARKLE_EDDSA_PRIVATE_KEY secret."; exit 1
          fi
          TAR="Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/${TAR}" -o "$RUNNER_TEMP/$TAR"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/$TAR" -C "$RUNNER_TEMP/sparkle"
          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf "%s" "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          OUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$KEY_FILE" "$ZIP_PATH")
          SIG=$(printf "%s" "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIG" ]; then echo "Failed to extract the EdDSA signature."; exit 1; fi
          echo "ed_signature=$SIG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rwya-release
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      SHORT_VERSION: ${{ inputs.version }}
      BUILD_VERSION: ${{ github.run_number }}
      ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      ZIP_LENGTH: ${{ needs.build.outputs.zip_length }}
      ED_SIGNATURE: ${{ needs.build.outputs.ed_signature }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: rwya-release
          path: ${{ runner.temp }}/release

      - name: Update appcast
        run: |
          set -euo pipefail
          python3 scripts/update_appcast.py \
            --appcast "$APPCAST_PATH" \
            --title "Remember Who You Are" \
            --link "https://github.com/${REPO}" \
            --description "Remember Who You Are updates" \
            --language "en" \
            --version "$BUILD_VERSION" \
            --short-version "$SHORT_VERSION" \
            --minimum-system-version "26.0" \
            --pub-date "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
            --enclosure-url "https://github.com/${REPO}/releases/download/v${SHORT_VERSION}/${ZIP_NAME}" \
            --enclosure-length "$ZIP_LENGTH" \
            --ed-signature "$ED_SIGNATURE" \
            --release-notes "Remember Who You Are ${SHORT_VERSION}."

      - name: Commit appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APPCAST_PATH"
          git commit -m "Update appcast for v${SHORT_VERSION}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${SHORT_VERSION}" "$RUNNER_TEMP/release/$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "Remember Who You Are ${SHORT_VERSION}" \
            --notes "Install: \`curl -fsSL https://rckbrcls.com/api/remember-who-you-are/install | bash\`. Updates are delivered through Sparkle." \
            --repo "$REPO"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public/remember-who-you-are
          cp "$APPCAST_PATH" public/remember-who-you-are/appcast.xml
          cp scripts/install.sh public/remember-who-you-are/install

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
